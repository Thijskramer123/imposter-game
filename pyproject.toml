[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "imposter-game"
version = "1.0.0"
description = "Who is the Imposter? — A terminal party game of bluffing and deduction"
requires-python = ">=3.8"
dependencies = ["colorama>=0.4.0"]

[project.scripts]
imposter = "imposter:main"
